<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estatísticas do Brasileirão: classificação por turno, desempenho em casa e fora, confronto direto e artilharia." />
    <title>BraSúmula · Estatísticas do Brasileirão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema escolhido antes da primeira pintura, para não piscar o tema errado.
      try {
        var tema = localStorage.getItem('sumula:tema')
        if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
