name: Publicar

# Gera o site e publica na Cloudflare como o Worker "sumula" (site + API das salas, com o banco D1 "sumula-salas").
# Secrets (Settings > Secrets and variables > Actions > Secrets): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Variável (aba Variables): SUMULA_API_URL = endereço do Worker "sumula-dados" (ou https://dados.<domínio>)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # Enquanto a Cloudflare não estiver configurada, o workflow só testa e gera o site, sem falhar.
      - name: Verifica a configuração
        id: config
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CONTA" ]; then echo "pronto=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Faltam os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: o site não será publicado (veja o README)."; fi
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gera o site
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.SUMULA_API_URL }}
          VITE_API_ESTATICA: "true"
      # Cria ou atualiza as tabelas do banco das salas (D1). Só roda as migrações novas de migrations/.
      # O token da Cloudflare precisa da permissão "D1: Edit".
      - name: Atualiza o banco das salas
        if: steps.config.outputs.pronto == 'true'
        run: npx --yes wrangler@4 d1 migrations apply sumula-salas --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publica na Cloudflare
        if: steps.config.outputs.pronto == 'true'
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
